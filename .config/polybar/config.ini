[colors]
base00 = #181818
base01 = #282828
base02 = #383838
base03 = #585858
base04 = #b8b8b8
base05 = #d8d8d8
base06 = #e8e8e8
base07 = #f8f8f8
base08 = #ab4642
base09 = #dc9656
base0A = #f7ca88
base0B = #a1b56c
base0C = #86c1b9
base0D = #7cafc2
base0E = #ba8baf
base0F = #a16946
background = ${colors.base00}
background-alt = ${colors.base01}
foreground = ${colors.base05}
foreground-alt = ${colors.base03}
primary = ${colors.base0A}
secondary = ${colors.base08}
alert = ${colors.base08}
disabled = ${colors.base03}

[bar/mystatus]
width = 100%
height = 32
offset-x = 0%
offset-y = 0%
radius = 0.0
fixed-center = true
bottom = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3
line-color = ${colors.base0D}
border-size = 2
border-color = ${colors.background-alt}
padding-left = 2
padding-right = 2
module-margin-left = 2
module-margin-right = 2
font-0 = Plus Jakarta Sans:pixelsize=10;1
font-1 = unifont:fontformat=truetype:size=9:antialias=false;0
font-2 = JetBrainsMono Nerd Font:pixelsize=12;1
modules-right = date time temperature sys kernel volume battery 
modules-center =
modules-left = i3
wm-restack = i3


[module/xwindow]
type = internal/xwindow
label = [ %title:0:30:...% ]
label-foreground = ${colors.base0E}
label-padding = 1

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 =
format-prefix = "KB "
format-prefix-foreground = ${colors.foreground-alt}
format-prefix-underline = ${colors.base0E}
label-layout = %layout%
label-layout-underline = ${colors.base0E}
label-indicator-padding = 3
label-indicator-margin = 2
label-indicator-background = ${colors.base0E}
label-indicator-underline = ${colors.base0E}

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %{F#7cafc2}DISK %{F-}%mountpoint%: %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.foreground-alt}

[module/bspwm]
type = internal/bspwm
label-focused = %index%
label-focused-background = ${colors.background-alt}
label-focused-underline = ${colors.base0D}
label-focused-padding = 3
label-occupied = %index%
label-occupied-padding = 3
label-urgent = %index%!
label-urgent-background = ${colors.alert}
label-urgent-padding = 3
label-empty = %index%
label-empty-foreground = ${colors.foreground-alt}
label-empty-padding = 3

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
format-padding = 1
index-sort = true
ws-icon-0 = 1;1
ws-icon-1 = 2;2
ws-icon-2 = 3;3
ws-icon-3 = 4;4
ws-icon-4 = 5;5
ws-icon-5 = 6;VI
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-8 = 9;
ws-icon-9 = 10;
ws-icon-default =
label-mode-padding = 2
label-mode-foreground = ${colors.base00}
label-mode-background = ${colors.primary}
; focused = Active workspace on focused monitor
label-focused = %icon%
label-focused-background = ${colors.background-alt}
label-focused-foreground = ${colors.base0D}
label-focused-underline = ${colors.base0D}
label-focused-padding = 3
; unfocused = Inactive workspace on any monitor
label-unfocused = %icon%
label-unfocused-foreground = ${colors.foreground-alt}
label-unfocused-padding = 3
; visible = Active workspace on unfocused monitor
label-visible = %icon%
label-visible-background = ${self.label-focused-background}
label-visible-foreground = ${self.label-focused-foreground}
label-visible-underline = ${self.label-focused-underline}
label-visible-padding = ${self.label-focused-padding}
; urgent = Workspace with urgency hint set
label-urgent = %icon%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.base00}
label-urgent-padding = 3

[module/mpd]
type = internal/mpd
format-online = -- [ <label-song> ] --
host = 127.0.0.1
port = 6600
interval = 2
icon-prev = " "
icon-stop = " "
icon-play = " "
icon-pause = " "
icon-next = " "
label-song-maxlen = 50
label-song-ellipsis = true
label-foreground = ${colors.base0E}

[module/xbacklight]
type = internal/xbacklight
format = <label> <bar>
label = BL:%percentage%
bar-width = 6
bar-indicator = |
bar-indicator-foreground = ${colors.base07}
bar-indicator-font = 2
bar-fill = ─
bar-fill-font = 2
bar-fill-foreground = ${colors.base0E}
bar-empty = ─
bar-empty-font = 2
bar-empty-foreground = ${colors.foreground-alt}

[module/backlight-acpi]
inherit = module/xbacklight
type = internal/backlight
card = intel_backlight

[module/sys]
type = custom/script
exec = ~/.config/polybar/scripts/sysinfo.sh
interval = 2
format = <label>
format-padding = 1
format-underline = ${colors.base0C}
label = %output%
;
; Kernel version, compact.
; Script: scripts/kernel.sh
;
[module/kernel]
type = custom/script
exec = ~/.config/polybar/scripts/kernel.sh
interval = 0
format = <label>
format-padding = 1
format-underline = ${colors.base0F}
label = %output%
label-foreground = ${colors.foreground}

[module/wlan]
type = internal/network
interface = wlp3s0
interval = 5.0
format-connected = <ramp-signal> <label-connected>
format-connected-underline = ${colors.base0E}
format-connected-padding = 1
label-connected = %essid%
format-disconnected = "WIFI "
format-disconnected-foreground = ${colors.foreground-alt}
format-disconnected-underline = ${colors.base03}
format-disconnected-padding = 1
ramp-signal-0 = WIFI0
ramp-signal-1 = WIFI1
ramp-signal-2 = WIFI2
ramp-signal-3 = WIFI3
ramp-signal-4 = WIFI4
ramp-signal-foreground = ${colors.foreground-alt}

[module/eth]
type = internal/network
interface = enp4s0f1
interval = 3.0
format-connected-underline = ${colors.base0B}
format-connected-prefix = "ETH "
format-connected-prefix-foreground = ${colors.foreground-alt}
format-connected-padding = 1
label-connected = %local_ip%
format-disconnected =

[module/date]
type = internal/date
interval = 5
date = "%B-%d-%Y"
format-prefix-foreground = ${colors.foreground-alt}
format-underline = ${colors.base0D}
format-padding = 1
label = %date%

[module/time]
type = internal/date
interval = 5
time = "%I:%M %p"
format-prefix-foreground = ${colors.foreground-alt}
format-underline = ${colors.base06}
format-padding = 1
label = %time%

[module/volume]
type = internal/alsa
format-volume = <label-volume>
format-volume-underline = ${colors.base0B}
format-volume-padding = 1
label-volume = "VOL %percentage%%"
label-volume-foreground = ${colors.foreground}
format-muted-prefix = "MUTE "
format-muted-foreground = ${colors.foreground-alt}
format-muted-underline = ${colors.base03}
format-muted-padding = 1
label-muted = muted

[module/battery]
type = internal/battery
battery = BAT0
adapter = ACAD
full-at = 98
format-charging = <animation-charging> <label-charging>
format-charging-underline = ${colors.base0A}
format-charging-padding = 1
format-discharging = <ramp-capacity> <label-discharging>
format-discharging-underline = ${colors.base0D}
format-discharging-padding = 1
format-full-prefix = "FULL "
format-full-prefix-foreground = ${colors.foreground}
format-full-underline = ${colors.base0B}
format-full-padding = 1
ramp-capacity-0 = "BAT0 "
ramp-capacity-1 = "BAT1 "
ramp-capacity-2 = "BAT2 "
ramp-capacity-foreground = ${colors.foreground}
animation-charging-0 = "CHG0 "
animation-charging-1 = "CHG1 "
animation-charging-2 = "CHG2 "
animation-charging-foreground = ${colors.foreground}
animation-charging-framerate = 750

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 60
format = <label>
format-underline = ${colors.base09}
format-padding = 1
format-warn = <label-warn>
format-warn-underline = ${colors.base08}
format-warn-padding = 1
label = "TEMP %temperature-c%"
label-warn = "HOT %temperature-c%"
label-warn-foreground = ${colors.base08}
ramp-0 = TEMP
ramp-1 = TEMP
ramp-2 = HOT
ramp-foreground = ${colors.foreground-alt}

[module/powermenu]
type = custom/menu
expand-right = false
format-spacing = 2
label-open = "POWER"
label-open-foreground = ${colors.base08}
label-close = "Back"
label-close-foreground = ${colors.base08}
label-separator = |
label-separator-foreground = ${colors.foreground-alt}
menu-0-0 = "reboot"
menu-0-0-exec = menu-open-1
menu-0-1 = "power off"
menu-0-1-exec = menu-open-2
menu-1-0 = "cancel"
menu-1-0-exec = menu-open-0
menu-1-1 = "reboot"
menu-1-1-exec = sudo reboot
menu-2-0 = "power off"
menu-2-0-exec = sudo poweroff
menu-2-1 = "cancel"
menu-2-1-exec = menu-open-0

[settings]
screenchange-reload = true

[global/wm]
margin-top = 0
margin-bottom = 0
; vim:ft=dosini
