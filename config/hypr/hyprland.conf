# MONITOR CONFIGURATION
# Disable laptop screen
monitor=eDP-1,disable

# Left monitor (physically on the left) - use the monitor with serial H4ZJ201801
monitor=DP-9,1920x1200@60,0x0,1

# Right monitor (physically on the right) - use the monitor with serial H4ZH402394
monitor=DP-8,1920x1200@60,1920x0,1

# Fallback
#monitor=,preferred,auto,1

# STARTUP APPLICATIONS
exec-once = ibus-daemon -drxR
exec-once = waybar
exec-once = swaync
exec-once = nm-applet --indicator
exec-once = variety
exec-once = dex --autostart --environment hyprland
exec-once = xfce-polkit

# Fix mint waybar Socket problem
exec-once = ln -sf $XDG_RUNTIME_DIR/hypr /tmp/hypr
# wallpaper
#exec-once = swaybg -i ~/Pictures/high-resolution/ayu_mirate.jpeg
exec-once = swaybg -i ~/Pictures/wallpaper/chris-henry-A4ySGX8BIxs-unsplash.jp -m fill

exec-once = xrdb ~/.Xresources



# ENVIRONMENT VARIABLES
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland

# GENERAL SETTINGS
general {
    gaps_in = 4
    gaps_out = 6
    border_size = 2
    col.active_border =  rgba(fff0dbcc)
    col.inactive_border = rgba(242b39ff)
    layout = dwindle
    allow_tearing = false
}

# DECORATION
decoration {
    rounding = 2

    blur {
        enabled = true
        size = 3
        passes = 2
        noise = 0.03
        contrast = 1.0
    }

    # Lite shadow
    shadow {
        enabled = true
        range = 8
        render_power = 3
        offset = 0 6
        scale = 1.0
        color = rgba(00000044)  # soft black (~27% opacity)
    }
}

# ANIMATIONS (minimal)
animations {
    enabled = true
    bezier = simple, 0.25, 0.1, 0.25, 1

    animation = windows, 1, 3, simple
    animation = windowsOut, 1, 3, simple, popin 80%
    animation = border, 1, 3, simple
    animation = fade, 1, 3, simple
    animation = workspaces, 1, 3, simple
}

# INPUT CONFIGURATION
input {
    kb_layout = us,de
    kb_options = grp:caps_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0
}

# LAYOUTS
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# MISC SETTINGS
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# WINDOW RULES
windowrulev2 = suppressevent maximize, class:.*

# KEYBINDINGS
$mod = SUPER

# CORE APPLICATIONS
bind = $mod, Return, exec, alacritty
bind = $mod, C, killactive,
bind = $mod, G, exec, emacs
bind = $mod, E, exec, thunar
bind = $mod, D, exec, wofi --show drun
bind = $mod, L, exec, hyprlock

# Screenshot a region
bind = $mod, O, exec, grim -g "$(slurp)" "$HOME/Pictures/Screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png"

# WINDOW MANAGEMENT
bind = $mod, F, fullscreen, 0
bind = $mod, Z, exec, hyprctl dispatch splitratio exact 0.5 && notify-send 'tile horizontally'
bind = $mod, V, togglesplit, # dwindle
bind = $mod SHIFT, Space, togglefloating,
bind = $mod, Space, focuscurrentorlast,

# FOCUS (VIM KEYS)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, N, movefocus, r

# FOCUS (ARROW KEYS)
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

# MOVE WINDOWS (VIM KEYS)
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# MOVE WINDOWS (ARROW KEYS)
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r

# WORKSPACES
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# MOVE TO WORKSPACE
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# RELOAD/EXIT
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, E, exit,

# MEDIA KEYS
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# FUNCTION KEYS
bindl = , F1, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = , F2, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = , F3, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , F4, exec, brightnessctl set 10%-
bindel = , F5, exec, brightnessctl set +10%
bindl = , F9, exec, amixer set Capture toggle

# RESIZE MODE (SUBMAP)
bind = $mod, R, submap, resize
submap = resize

binde = , J, resizeactive, -10 0
binde = , K, resizeactive, 0 10
binde = , L, resizeactive, 0 -10
binde = , semicolon, resizeactive, 10 0

binde = , left, resizeactive, -10 0
binde = , down, resizeactive, 0 10
binde = , up, resizeactive, 0 -10
binde = , right, resizeactive, 10 0

bind = , Return, submap, reset
bind = , escape, submap, reset
bind = $mod, R, submap, reset

submap = reset

# MOUSE BINDINGS
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
