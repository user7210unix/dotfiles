# HYPRLOCK CONFIGURATION
# Matching minimal dark theme

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 5
    contrast = 0.8
    brightness = 0.5
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(192, 192, 192, 1.0)
    font_size = 90
    font_family = M PLUS CODE Latin semiBold
    position = 0, 200
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d, %Y")"
    color = rgba(192, 192, 192, 0.8)
    font_size = 24
    font_family = M PLUS CODE Latin 
    position = 0, 80
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 1.0)
    inner_color = rgba(26, 26, 26, 1.0)
    font_color = rgba(192, 192, 192, 1.0)
    fade_on_empty = false
    placeholder_text = <span foreground="##c0c0c0">Password...</span>
    hide_input = false
    check_color = rgba(74, 111, 221, 1.0)
    fail_color = rgba(255, 106, 106, 1.0)
    fail_text = <span foreground="##ff6a6a">Authentication failed</span>
    capslock_color = rgba(255, 106, 106, 1.0)
    position = 0, -100
    halign = center
    valign = center
}

# USER LABEL
label {
    monitor =
    text = $USER
    color = rgba(192, 192, 192, 0.8)
    font_size = 18
    font_family = M PLUS CODE Latin 
    position = 0, -160
    halign = center
    valign = center
}

# CAPSLOCK WARNING
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/capslock.sh
    color = rgba(255, 106, 106, 1.0)
    font_size = 14
    font_family = M PLUS CODE Latin Bold
    position = 0, -200
    halign = center
    valign = center
}
